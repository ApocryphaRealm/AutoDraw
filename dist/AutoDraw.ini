[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=0

[Automation]

; Draws your weapon or magic the instant something targets you in combat: 0 = off, 1 = on
bEnableAutoDraw=1

; Sheathes your weapon or magic a set delay after you leave combat, or after you draw it
; manually: 0 = off, 1 = on
bEnableAutoSheathe=1

; How long to wait, in seconds, after leaving combat or drawing manually, before the forced
; sheathe happens. Reset by attacking, blocking, being airborne, or still being in combat.
fSheatheDelaySeconds=6.0

; Skips the forced sheathe while a bound (conjured) weapon is drawn, so it is not dismissed
; early - it will still end on its own duration or if you sheathe it yourself: 0 = off, 1 = on
bExemptBoundWeapons=1
